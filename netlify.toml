# Netlify deployment (HTTPS by default). See docs/SETUP.md §5.
# Redirects and headers live in public/_redirects and public/_headers so they also apply to
# drag-and-drop (Netlify Drop) deploys of the dist/ folder, which don't read this file.
[build]
  command = "npm ci && npm run build"
  publish = "dist"
  # Skip app builds when only the marketing site (website/, its own Netlify site) changed. Exit 0 = skip.
  # Builds anyway when there is no earlier deploy to compare with (both refs equal).
  ignore = 'if [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ":(exclude)website"'

[build.environment]
  NODE_VERSION = "22"
  # Public client values: the Supabase URL and publishable key are meant to ship in the
  # browser bundle (access is enforced by RLS), so it's fine to commit them here.
  VITE_SUPABASE_URL = "https://haryomdlsgrgrnsbdxui.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_YKXvyZGJhRezItObxUh_fg_0qc30qAv"
  # Web Push VAPID PUBLIC key (public by design; the private key lives only in Supabase function secrets).
  VITE_VAPID_PUBLIC_KEY = "BHvEU9vOgpEy_N8qJo0qRiFjwhTeXVl9BqaiE3-R_YxMJPAlbKQEjrbdhj_2ei8s-FM9HlkSSOwVKT8VABV-7mI"
