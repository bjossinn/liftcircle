# Checks every pull request (and every push to main): types, unit tests, production build, and the database/RLS
# suites against a throwaway PostgreSQL 16 cluster (preinstalled on GitHub's Ubuntu runners), so a migration is
# tested before merging deploys it. The Playwright suite needs browsers and runs locally (npm run test:all).
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      # Database suites (same job, so a required "check" covers them before auto-merge deploys a migration).
      - name: PostgreSQL 16 binaries
        run: test -x /usr/lib/postgresql/16/bin/initdb || (sudo apt-get update && sudo apt-get install -y postgresql-16)
      - run: npm run test:rls
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
      - run: npm run test:ai-db
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
      - run: npm run test:push-db
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
