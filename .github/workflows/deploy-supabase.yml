# Deploys the backend when changes reach main: new migrations (supabase db push applies only files not yet
# recorded in supabase_migrations.schema_migrations), then every Edge Function in supabase/functions.
# The site itself is deployed by Netlify's own GitHub integration (netlify.toml).
#
# Repo secrets (Settings → Secrets and variables → Actions), added by the project owner:
#   SUPABASE_ACCESS_TOKEN  personal access token from https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_URL        Session pooler connection string (Dashboard → Connect), with the DB password filled in
# Optional: add required reviewers to the "production" environment to approve each deploy by hand.
name: Deploy Supabase
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
env:
  PROJECT_REF: haryomdlsgrgrnsbdxui
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_URL as repository secrets (see docs/GITHUB.md)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Show pending migrations
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
