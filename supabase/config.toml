# Supabase CLI configuration for LOCAL development (`supabase start`).
# Hosted projects are configured in the dashboard; see docs/BACKEND.md.
project_id = "liftcircle"

[api]
enabled = true
port = 54321
# Only these schemas are exposed through the Data API. `private` (helpers) is deliberately absent.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Local email testing UI (confirmation / recovery mails land here).
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://127.0.0.1:5173/auth/callback",
  "http://localhost:4173/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
# Email confirmation ON: new accounts must verify their address before signing in.
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# Edge Functions. verify_jwt = false for ALL functions, matching the hosted project: it signs user tokens with
# ECC (P-256) keys, which the gateway's legacy "Verify JWT" check rejects. Each function authenticates in code
# instead — user-facing ones via requireUser() (supabase/functions/_shared), cleanup-media via CLEANUP_SECRET —
# and refuses requests without a valid session (live check: 401 without a sign-in). The deploy workflow
# (.github/workflows/deploy-supabase.yml) reads these values, so keep them in sync with the dashboard.
[functions.finalize-post]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.cleanup-media]
verify_jwt = false

# training assistant (OpenAI or Anthropic, chosen by secrets). See docs/AI_COACH.md.
[functions.ai-coach]
verify_jwt = false

[functions.geocode]
verify_jwt = false

[functions.finalize-coach-media]
verify_jwt = false

# Web Push sender, run by pg_cron; authenticates with the x-push-secret header (PUSH_CRON_SECRET). See docs/SETUP.md.
[functions.push-send]
verify_jwt = false
